digitized_dir: results/ahus_benchmark_full
ground_truth_dir: data/ahus_benchmark_full/ground_truth
results_csv: results/ahus_metrics_full_aligned.csv

shift_steps: 400

# Per-record time-axis scale search. The pipeline anchors its time axis to the *detected* signal extent
# (LeadIdentifier.normalize), which varies with how much of the trace the segmenter recovers, so the
# mapping from sample index to absolute time is not fixed across images and no single global constant
# corrects it -- measured spread across records was ~2.3% (IQR). The fitted scale is reported per lead
# in the output CSV, so the timing uncertainty stays visible rather than being absorbed into the score.
scale_min: 0.94
scale_max: 1.02
scale_step: 0.005
