MODEL:
  class_path: 'src.model.unet.UNet'
  KWARGS:
    num_in_channels: 3
    num_out_channels: 4
    dims: [32, 64, 128, 256, 320, 320, 320, 320]
    depth: 2

TRAIN:
  # torch.compile requires Triton, which is not included in PyTorch's Windows wheels (Linux-only), so
  # compiling fails at the first forward pass with TritonMissing. Set back to True on Linux, or on
  # Windows after installing the third-party `triton-windows` package.
  COMPILE: False
  CUDNN_BENCHMARK: True
  LR_SCHEDULER:
    class_path: 'src.utils.CosineToConstantLR'
    KWARGS:
      T_max: 10000
      eta_min_divisor: 10
  STOPPER:
    class_path: 'src.utils.EarlyStopper'
    KWARGS:
      metric: 'val_loss'
      patience: 10
      delta: 0
  OPTIMIZER:
    class_path: 'src.optimizer.adammuon.AdamMuon'
    KWARGS:
      lr: 0.0037
      weight_decay: 0.01
  MIXED_PRECISION_SCALER:
    class_path: 'torch.amp.GradScaler'
    KWARGS: {}
  CRITERION:
    class_path: 'src.loss.loss.DiceFocalLoss'
    KWARGS:
      alpha: 1.0
      # Topology-aware clDice term (Shit et al., CVPR 2021), added on top of Dice + Focal. Penalizes
      # broken/disconnected trace predictions even when pixel-overlap loss barely notices. Starting
      # point: weight roughly on par with the Dice/Focal terms; iterations should cover the pixel
      # radius of the thickest signal/grid strokes at training crop resolution (1024x1024) -- tune
      # both against src/evaluate.py's SNR/Pearson metrics rather than assuming these are optimal.
      cl_dice_weight: 0.5
      cl_dice_iterations: 5
  KWARGS:
    # Measured ~21.4 min/epoch at batch 4 on a 16 GB RTX 2000 Ada, so 13 epochs fits a ~5 h budget.
    # This also happens to suit the LR schedule: CosineToConstantLR's T_max is 10000 *steps*, which at
    # 1028 steps/epoch bottoms out around epoch 10, leaving ~3 epochs at eta_min to settle. Raise this
    # (and T_max with it) for a longer run -- at 100 epochs the LR would sit at the floor for 90 of them.
    epochs: 13
    metrics: []
    device: 'cuda'
    metrics:
      -
        class_path: 'src.utils.SavePlotsEveryN'
        fit: false
        KWARGS:
          n: 200
          plot_path: 'sandbox/unet_pred_and_target.png'

HYPERPARAMETER_SEARCH:
  SEARCH_SPACE: false
    # --------------- Uncomment to enable hyperparameter search with ray ---------------
    # TRAIN:
    #   OPTIMIZER:
    #     class_path:
    #       SAMPLE_TYPE: 'ray.tune.grid_search'
    #       KWARGS:
    #         values:
    #           - torch.optim.AdamW
    #           - src.optimizer.adammuon.AdamMuon
    #     KWARGS:
    #       lr:
    #         SAMPLE_TYPE: 'ray.tune.grid_search'
    #         KWARGS:
    #           values: [0.00050119, 0.00069895, 0.00097474, 0.00135936, 0.00189574, 0.00264376, 0.00368695, 0.00514175, 0.0071706 , 0.01      ]
    # --------------- Uncomment to enable hyperparameter search with ray ---------------

DATALOADER:
  class_path: 'torch.utils.data.DataLoader'
  KWARGS:
    # 4 is the largest batch that fits in 16 GB VRAM at 1024x1024 crops (measured: 12.9 GB peak, 81%).
    # Larger values do not OOM on Windows/WDDM -- they silently spill into shared system memory and
    # collapse throughput (batch 6 -> 19.2 GB / 9.8 s/step; batch 12 -> 38.1 GB / ~70 s/step, i.e.
    # 6.7 h/epoch vs 0.32 h/epoch at batch 4). Raise this on a larger-VRAM GPU, but re-measure rather
    # than assuming, and see the LR note in TRAIN.OPTIMIZER if you change it.
    batch_size: 4
    shuffle: True
    num_workers: 4
    pin_memory: True
    pin_memory_device: 'cuda'
    prefetch_factor: 6
    drop_last: True

DATASET:
  class_path: 'src.dataset.ecg_scan.ECGScanDataset'
  KWARGS: {}
  TRAIN:
    KWARGS:
      data_path: '../../data/ecg_dataset/train'
    TRANSFORM:
      class_path: 'src.transform.vision.ComposedTransform'
      KWARGS:
        transform_config:
          - class_path: 'src.transform.vision.RandomCrop'
            KWARGS:
              size: [1024, 1024]
          - class_path: 'src.transform.vision.RandomFlipTransform'
            KWARGS: {}
          - class_path: 'src.transform.vision.RandomSaturationContrast'
            KWARGS: {}
          - class_path: 'src.transform.vision.RandomQRCode'
            KWARGS: {}
          - class_path: 'src.transform.vision.RandomBorder'
            KWARGS: {}
          - class_path: 'src.transform.vision.RandomFourierDropout'
            KWARGS: {}
          - class_path: 'src.transform.vision.RandomGradientOverlay'
            KWARGS: {}
          - class_path: 'src.transform.vision.RandomJPEGCompressionTransform'
            KWARGS: {}
          - class_path: 'src.transform.vision.RandomZoomTransform'
            KWARGS: {}
          - class_path: 'src.transform.vision.RefineMask'
            KWARGS: {}

  VAL:
    KWARGS:
      data_path: '../../data/ecg_dataset/val'
    TRANSFORM:
      class_path: 'src.transform.vision.ComposedTransform'
      KWARGS:
        transform_config:
          - class_path: 'src.transform.vision.RandomCrop'
            KWARGS:
              size: [1024, 1024]
          - class_path: 'src.transform.vision.RefineMask'
            KWARGS: {}
  TEST:
    KWARGS:
      data_path: '../../data/ecg_dataset/val'
